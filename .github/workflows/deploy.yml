name: Deploy ASR Trading to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Assemble source package
        run: |
          cat source-package/asr-trading-source-*.b64 | base64 --decode > /tmp/asr-trading-source.tar.xz
          mkdir source-tree
          tar -xJf /tmp/asr-trading-source.tar.xz -C source-tree
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source-tree/package-lock.json
      - name: Install dependencies
        working-directory: source-tree
        run: npm ci
      - name: Build site
        working-directory: source-tree
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source-tree/dist
      - name: Normalize repository into source files
        run: |
          cp -R source-tree/. .
          rm -rf source-package source-tree
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: expand ASR Trading source'
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
